const SALT = "RNbe3ZEQapqAOUkUeGqs9w==";
const IV = "1c5s/UxH/iHqXFud";
const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
document.getElementById('unlock').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pin = document.getElementById('pin').value;
  const error = document.getElementById('error');
  const img = document.getElementById('photo');
  error.textContent = 'Checking PIN…';
  img.style.display = 'none';
  try {
    const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:fromB64(SALT), iterations:300000, hash:'SHA-256'},

    img.src = URL.createObjectURL(blob);
    img.style.display = 'block';
    error.textContent = '';
  } catch (_) {
    error.textContent = 'Incorrect PIN. Please try again.';
  }
});
